[package]
name = "rigspark-desktop"
version = "2.4.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
tauri = { version = "2.11.5", features = ["dynamic-acl"] }
rfd = "0.15"
rigspark-gui = { path = "../../../crates/rigspark-gui" }
rigspark-runtime = { path = "../../../crates/rigspark-runtime" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync"] }
serde_json = "1"
url = "2"

[build-dependencies]
tauri-build = "2.6.3"

[dev-dependencies]
tauri = { version = "2.11.5", features = ["test"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"