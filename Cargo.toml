[workspace]
members = ["crates/rigspark-core", "crates/rigspark-cli", "crates/rigspark-runtime", "crates/rigspark-gui"]
resolver = "3"
exclude = ["apps/desktop/src-tauri", "vendor/crossterm"]

[workspace.package]
version = "3.0.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/shashankswe2020-ux/rigspark"
homepage = "https://shashankswe2020-ux.github.io/rigspark/"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"