[alias]
llmup = "run --quiet --locked -p rigspark-cli --bin llmup --"
rigspark = "run --quiet --locked -p rigspark-cli --bin rigspark --"
native-dist = "run --locked -p rigspark-cli --bin llmup-dist --"
catalog-freshness = "run --quiet --locked -p rigspark-cli --bin llmup-catalog-freshness --"
catalog-bootstrap = "run --quiet --locked -p rigspark-cli --bin llmup-catalog-bootstrap --"
catalog-refresh = "run --quiet --locked -p rigspark-cli --bin llmup-catalog-refresh --"
catalog-enrich = "run --quiet --locked -p rigspark-cli --bin llmup-catalog-enrich --"
generation-enrich = "run --quiet --locked -p rigspark-cli --bin llmup-generation-enrich --"
catalog-coverage = "run --quiet --locked -p rigspark-cli --bin llmup-catalog-coverage --"
catalog-notice = "run --quiet --locked -p rigspark-cli --bin llmup-catalog-notice --"
catalog-sign = "run --quiet --locked -p rigspark-cli --bin llmup-catalog-sign --"
catalog-quality = "run --quiet --locked -p rigspark-cli --bin llmup-catalog-quality --"
catalog-propose = "run --quiet --locked -p rigspark-cli --bin llmup-catalog-propose --"
native-performance = "run --quiet --locked --release -p rigspark-cli --example native-performance --"
native-retirement = "run --quiet --locked -p rigspark-cli --example retirement-check --"
native-browser-smoke = "run --quiet --locked -p rigspark-gui --example browser_smoke --"
state-parity = "test --locked -p rigspark-cli --test state_parity"
workflow-parity = "test --locked -p rigspark-cli --test workflow_parity"