[package]
name = "rigspark-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Loopback-only local AI chat workspace for rigspark (`llmup gui`): model picker, agents, skills and MCP tools."
keywords = ["llm", "local-llm", "ollama", "chat", "mcp"]
categories = ["artificial-intelligence", "web-programming::http-server"]
include = ["src/**", "static/**", "vendor/**", "build.rs", "Cargo.toml"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/rigspark-{ target }{ archive-suffix }"
bin-dir = "rigspark-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
rigspark-runtime = { path = "../rigspark-runtime", version = "3.0.1" }
rigspark-core = { path = "../rigspark-core", version = "3.0.1" }
axum = { version = "0.8", features = ["json", "query", "tokio", "http1"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
serde.workspace = true
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }
include_dir = "0.7"
sysinfo = "0.38"
url = "2"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
fantoccini = { version = "=0.22.1", default-features = false }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }

[lints]
workspace = true