[package]
name = "rigspark-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Which local LLMs can your computer run? Hardware-aware CLI with yes/slow/no verdicts and tok/s estimates, then verified installs via Ollama, llama.cpp, MLX or LM Studio."
readme = "../../README.md"
keywords = ["llm", "ollama", "vram", "local-llm", "llama-cpp"]
categories = ["command-line-utilities", "artificial-intelligence"]
include = ["src/**", "Cargo.toml"]

[features]
default = ["maintainer-tools"]
# Catalog, parity and packaging tools; release archives ship only the public aliases.
maintainer-tools = []

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/rigspark-{ target }{ archive-suffix }"
bin-dir = "rigspark-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[[bin]]
name = "llmup-fit-parity"
path = "src/main.rs"
required-features = ["maintainer-tools"]

[[bin]]
name = "llmup-native"
path = "src/native.rs"
required-features = ["maintainer-tools"]

[[bin]]
name = "llmup"
path = "src/llmup.rs"

[[bin]]
name = "rigspark"
path = "src/rigspark.rs"

[[bin]]
name = "llmup-dist"
path = "src/dist.rs"
required-features = ["maintainer-tools"]

[[bin]]
name = "llmup-catalog-freshness"
path = "src/catalog_freshness.rs"
required-features = ["maintainer-tools"]

[[bin]]
name = "llmup-catalog-bootstrap"
path = "src/catalog_bootstrap.rs"
required-features = ["maintainer-tools"]

[[bin]]
name = "llmup-catalog-refresh"
path = "src/catalog_refresh.rs"
required-features = ["maintainer-tools"]

[[bin]]
name = "llmup-catalog-coverage"
path = "src/catalog_coverage.rs"
required-features = ["maintainer-tools"]

[[bin]]
name = "llmup-catalog-notice"
path = "src/catalog_notice.rs"
required-features = ["maintainer-tools"]

[[bin]]
name = "llmup-catalog-enrich"
path = "src/catalog_enrich.rs"
required-features = ["maintainer-tools"]

[[bin]]
name = "llmup-catalog-admit"
path = "src/catalog_admit.rs"
required-features = ["maintainer-tools"]

[[bin]]
name = "llmup-catalog-site"
path = "src/catalog_site.rs"
required-features = ["maintainer-tools"]

[[bin]]
name = "llmup-generation-admit"
path = "src/generation_admit.rs"
required-features = ["maintainer-tools"]

[[bin]]
name = "llmup-generation-enrich"
path = "src/generation_enrich.rs"
required-features = ["maintainer-tools"]

[[bin]]
name = "llmup-catalog-sign"
path = "src/catalog_sign.rs"
required-features = ["maintainer-tools"]

[[bin]]
name = "llmup-catalog-quality"
path = "src/catalog_quality.rs"
required-features = ["maintainer-tools"]

[[bin]]
name = "llmup-catalog-propose"
path = "src/catalog_propose.rs"
required-features = ["maintainer-tools"]

[dependencies]
rigspark-core = { path = "../rigspark-core", version = "3.0.2" }
rigspark-runtime = { path = "../rigspark-runtime", version = "3.0.2" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde.workspace = true
serde_json.workspace = true
unicode-segmentation = "1"
unicode-normalization = "0.1"
regex = "1"
sha2 = "0.10"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
crossterm = { package = "rigspark-crossterm", version = "0.29.0", path = "../../vendor/crossterm", features = ["event-stream"] }
futures-util = "0.3"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
portable-pty = "0.9"