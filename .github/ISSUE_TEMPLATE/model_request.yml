name: Model catalog request
description: Request source-backed admission of a public Hugging Face model.
title: "[Model request]: "
labels:
  - catalog:request
body:
  - type: markdown
    attributes:
      value: |
        Requests and validation results are public. Do not include credentials, private-model access, or unrelated links.
        Admission requires a supported open-weight license and a verifiable RigSpark-compatible artifact.
  - type: input
    id: model_url
    attributes:
      label: Hugging Face model URL
      description: Enter the canonical public repository URL without a file path, query, or fragment.
      placeholder: https://huggingface.co/owner/repository
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason or use case
      description: Optional. Explain why this model would be useful in the catalog.
      placeholder: This model would help with...
    validations:
      required: false
  - type: checkboxes
    id: integrity
    attributes:
      label: Integrity requirements
      options:
        - label: I understand that a request needs public, license-compatible, integrity-pinned runnable weights and may remain blocked until those exist.
          required: true
