name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Retirement, Format, Lint, Test, Package & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch exact revision without an action runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset AUTH GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify pinned toolchain
        run: rustup show active-toolchain
      - name: Require complete retirement
        run: cargo native-retirement
      - name: Site data matches the shipped catalogs
        run: cargo catalog-site --check
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast -- --test-threads=2
      - name: Package publishable crates
        run: cargo package --workspace --locked --allow-dirty --no-verify
      - name: Build
        run: cargo build --workspace --locked
