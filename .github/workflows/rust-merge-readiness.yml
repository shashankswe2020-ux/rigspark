name: Rust Merge Readiness

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [feature/rust-backend-migration]

permissions:
  contents: read

concurrency:
  group: rust-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retirement:
    name: Native retirement gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch exact revision without an action runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset AUTH GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Rust toolchain
        run: rustup show active-toolchain
      - name: Validate gate behavior
        run: cargo test --locked -p rigspark-cli --test retirement
      - name: Require complete retirement
        run: cargo native-retirement > retirement-report.json
      - name: Retirement evidence
        if: always()
        run: |
          if test -f retirement-report.json; then
            cat retirement-report.json
          fi

  performance:
    name: Native release budgets (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Fetch exact revision without an action runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset AUTH GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Rust toolchain
        run: rustup show active-toolchain
      - name: Validate budget behavior
        run: cargo test --locked -p rigspark-cli --test performance
      - name: Build optimized candidate and runner
        run: cargo build --locked --release -p rigspark-cli --bin llmup --example native-performance
      - name: Measure native release budgets
        run: target/release/examples/native-performance --executable target/release/llmup > performance-report.json
      - name: Performance evidence
        if: always()
        run: |
          if test -f performance-report.json; then
            cat performance-report.json
            {
              printf '### Native Release Budgets\n\nCommit: %s\n\n```json\n' "$GITHUB_SHA"
              cat performance-report.json
              printf '\n```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi