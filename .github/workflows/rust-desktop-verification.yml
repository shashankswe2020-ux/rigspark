name: Rust Desktop Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/rust-desktop-verification.yml
      - rust-toolchain.toml
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - apps/desktop/src-tauri/**
      - crates/rigspark-gui/static/**
      - scripts/native-browser-journeys.sh
      - scripts/rust-dialog-smoke.*
      - vendor/**
      - .cargo/**

permissions:
  contents: read

concurrency:
  group: rust-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Native desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Fetch exact revision without an action runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset AUTH GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install Linux native WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb dbus-x11 python3-pyatspi xdg-desktop-portal-gtk
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - name: Native lint
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Native tests
        timeout-minutes: 15
        run: |
          cargo test --workspace --locked --no-fail-fast -- --nocapture --test-threads=2
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Native build
        run: |
          cargo build --workspace --locked
          cargo build --locked -p rigspark-cli --example dialog-smoke
          cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Real desktop WebView smoke
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          RIGSPARK_HOME: ${{ runner.temp }}/llmup-r22
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            dbus-run-session -- xvfb-run -a apps/desktop/src-tauri/target/debug/rigspark-desktop --smoke-test
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            apps/desktop/src-tauri/target/debug/rigspark-desktop.exe --smoke-test
          else
            apps/desktop/src-tauri/target/debug/rigspark-desktop --smoke-test
          fi
      - name: Actual native folder dialogs
        if: runner.os != 'macOS'
        timeout-minutes: 3
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          XDG_CURRENT_DESKTOP: GNOME
          GTK_MODULES: gail:atk-bridge
          NO_AT_BRIDGE: "0"
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a dbus-run-session -- target/debug/examples/dialog-smoke
          else
            target/debug/examples/dialog-smoke.exe
          fi
      - name: Native HTTP and browser journeys
        # Prefers the runner image's preinstalled ChromeDriver. CHROMEWEBDRIVER has been seen
        # unset on windows-2022, so fall back to the image default, then PATH, then the official
        # Chrome for Testing driver for the installed Chrome build.
        run: |
          set -euo pipefail
          exe=""
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            chrome=$(command -v google-chrome)
            version=$("$chrome" --version | grep -oE '[0-9]+(\.[0-9]+){3}')
            platform=linux64 default_dir=""
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            chrome="C:/Program Files/Google/Chrome/Application/chrome.exe"
            version=$(powershell -NoProfile -Command "(Get-Item '$chrome').VersionInfo.ProductVersion" | tr -d '\r')
            platform=win64 default_dir="C:/SeleniumWebDrivers/ChromeDriver" exe=.exe
          else
            chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
            version=$("$chrome" --version | grep -oE '[0-9]+(\.[0-9]+){3}')
            platform=mac-arm64 default_dir=""
          fi
          driver=""
          for dir in "${CHROMEWEBDRIVER:-}" "$default_dir"; do
            if [[ -n "$dir" ]]; then
              [[ "$RUNNER_OS" == "Windows" ]] && dir=$(cygpath -u "$dir")
              if [[ -x "$dir/chromedriver$exe" ]]; then driver="$dir/chromedriver$exe"; break; fi
            fi
          done
          if [[ -z "$driver" ]] && command -v "chromedriver$exe" > /dev/null; then
            driver=$(command -v "chromedriver$exe")
          fi
          if [[ -z "$driver" ]]; then
            url=$(curl -fsSL https://googlechromelabs.github.io/chrome-for-testing/latest-patch-versions-per-build-with-downloads.json \
              | jq -er --arg build "${version%.*}" --arg platform "$platform" '.builds[$build].downloads.chromedriver[] | select(.platform == $platform) | .url')
            case "$url" in https://storage.googleapis.com/chrome-for-testing-public/*) ;; *) echo "unexpected driver URL: $url" >&2; exit 1 ;; esac
            curl -fsSL "$url" -o "$RUNNER_TEMP/chromedriver.zip"
            unzip -q -o "$RUNNER_TEMP/chromedriver.zip" -d "$RUNNER_TEMP"
            driver="$RUNNER_TEMP/chromedriver-$platform/chromedriver$exe"
          fi
          echo "Chrome $version; driver $driver ($("$driver" --version))"
          bash scripts/native-browser-journeys.sh "$chrome" "$driver" "$RUNNER_TEMP/rust-browser"
      - name: Verification summary
        if: always()
        run: |
          printf '## R22: %s\n\nCommit: %s\n\nOnly native tooling is installed. Consult each step result for native tests, real WebView and folder-dialog checks, and native browser journeys. Signing and release publication are not performed.\n' "$RUNNER_OS" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
