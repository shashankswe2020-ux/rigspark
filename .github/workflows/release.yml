name: Native Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch exact revision without an action runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset AUTH GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Verify pinned toolchain
        run: rustup show active-toolchain
      - name: Require complete retirement
        run: cargo native-retirement
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast -- --test-threads=2

  build:
    name: Archive (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch exact revision without an action runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset AUTH GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install target
        run: |
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"
      - name: Build unsigned archive
        run: cargo native-dist package --target "${{ matrix.target }}"
      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "rigspark $GITHUB_REF_NAME" --notes "Release notes are added when all archives are verified." \
              || gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi
          stem="rigspark-${{ matrix.target }}"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            "target/native-dist/$stem.tar.gz" "target/native-dist/$stem.tar.gz.sha256"

  desktop-macos:
    name: Desktop app (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, arch: aarch64 }
          - { target: x86_64-apple-darwin, arch: x86_64 }
    runs-on: macos-15
    # Apple's notary service routinely takes 15-30 minutes per submission, and the app and
    # the dmg are notarized separately.
    timeout-minutes: 150
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch exact revision without an action runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset AUTH GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install target and pinned Tauri CLI
        run: |
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"
          cargo install tauri-cli --version 2.12.4 --locked
      - name: Build bundled llama-server from pinned llama.cpp
        run: scripts/build-bundled-llama-server.sh "${{ matrix.target }}"
      - name: Import Developer ID certificate into a temporary keychain
        id: identity
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::APPLE_CERTIFICATE is not set; tagged releases must ship a Developer ID signed and notarized dmg."
              exit 1
            fi
            echo "::notice::APPLE_CERTIFICATE is not set; building an ad-hoc signed app (not for distribution)."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/rigspark-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          cert="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$cert"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          if [ -z "$identity" ]; then
            echo "::error::APPLE_CERTIFICATE does not contain a Developer ID Application identity."
            security find-identity -v -p codesigning "$keychain"
            exit 1
          fi
          echo "::add-mask::$keychain_password"
          echo "Signing as: $identity"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
      - name: Build, sign and notarize RigSpark.app and dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SIGNING_IDENTITY: ${{ steps.identity.outputs.identity }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CI: "true"
        run: |
          set -euo pipefail
          cd apps/desktop/src-tauri
          extra=()
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY is not set; building without in-app update artifacts."
            extra=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          notary=()
          if [ "$SIGNING_IDENTITY" != "-" ]; then
            # Tauri signs every binary (including llama-server) with the Hardened Runtime,
            # then notarizes and staples RigSpark.app when Apple credentials are present.
            if [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_P8" ]; then
              export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
              printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$APPLE_API_KEY_PATH"
              unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
              notary=(--key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
            elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              unset APPLE_API_ISSUER APPLE_API_KEY
              notary=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
            else
              echo "::error::Signing identity is set but notarization credentials are missing. Set APPLE_API_ISSUER, APPLE_API_KEY_ID and APPLE_API_KEY_P8, or APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID."
              exit 1
            fi
          fi
          unset APPLE_API_KEY_P8
          identity_config="$(python3 -c 'import json,sys; print(json.dumps({"bundle":{"macOS":{"signingIdentity":sys.argv[1]}}}))' "$SIGNING_IDENTITY")"
          # codesign --timestamp and the notary service are network calls that fail
          # intermittently on hosted runners; the rebuild is incremental, so retry the bundle.
          for attempt in 1 2 3; do
            if cargo tauri build --target "${{ matrix.target }}" --bundles app,dmg --config tauri.bundled.conf.json --config "$identity_config" ${extra[@]+"${extra[@]}"}; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::cargo tauri build failed three times."
              exit 1
            fi
            echo "::warning::cargo tauri build failed (attempt $attempt); retrying in 60s."
            sleep 60
          done
          # stapler and spctl look up tickets on Apple's servers; retry network blips.
          retry() {
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              echo "::warning::'$1 $2' failed (attempt $attempt); retrying in 20s."
              sleep 20
            done
            return 1
          }
          out="target/${{ matrix.target }}/release/bundle"
          app="$out/macos/RigSpark.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          test -x "$app/Contents/MacOS/llama-server"
          case "${{ matrix.arch }}" in aarch64) want=arm64 ;; *) want=x86_64 ;; esac
          test "$(lipo -archs "$app/Contents/MacOS/llama-server")" = "$want"
          dmg="$(ls "$out"/dmg/*.dmg)"
          if [ "$SIGNING_IDENTITY" != "-" ]; then
            codesign --display --verbose=2 "$app/Contents/MacOS/llama-server" 2>&1 | grep -q "Authority=Developer ID Application"
            codesign --display --verbose=2 "$app" 2>&1 | grep -q "flags=.*runtime"
            retry xcrun stapler validate "$app"
            retry spctl --assess --type execute --verbose=2 "$app"
            # The dmg is the download, so it carries its own signature and notarization ticket.
            if ! codesign --display "$dmg" >/dev/null 2>&1; then
              codesign --sign "$SIGNING_IDENTITY" --timestamp "$dmg"
            fi
            codesign --verify --strict --verbose=2 "$dmg"
            submission=""
            for attempt in 1 2 3; do
              if submission="$(xcrun notarytool submit "$dmg" "${notary[@]}" --no-wait --output-format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"; then
                break
              fi
              [ "$attempt" = 3 ] && { echo "::error::Could not submit the dmg for notarization."; exit 1; }
              sleep 30
            done
            echo "dmg notarization submission: $submission"
            # Poll instead of holding one long connection, so a network blip does not lose the result.
            status=""
            for poll in $(seq 1 90); do
              status="$(xcrun notarytool info "$submission" "${notary[@]}" --output-format json 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' || true)"
              echo "notarization status ($poll): ${status:-unreachable}"
              case "$status" in
                Accepted) break ;;
                Invalid|Rejected)
                  xcrun notarytool log "$submission" "${notary[@]}" || true
                  echo "::error::Apple rejected the dmg notarization ($status)."
                  exit 1 ;;
              esac
              sleep 30
            done
            if [ "$status" != "Accepted" ]; then
              echo "::error::dmg notarization did not finish in time (last status: ${status:-unreachable})."
              exit 1
            fi
            retry xcrun stapler staple "$dmg"
            retry xcrun stapler validate "$dmg"
            retry spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          fi
          mkdir -p ../../../desktop-dist
          cp "$dmg" "../../../desktop-dist/RigSpark_${{ matrix.arch }}.dmg"
          if [ -f "$out/macos/RigSpark.app.tar.gz.sig" ]; then
            cp "$out/macos/RigSpark.app.tar.gz" "../../../desktop-dist/RigSpark_${{ matrix.arch }}.app.tar.gz"
            cp "$out/macos/RigSpark.app.tar.gz.sig" "../../../desktop-dist/RigSpark_${{ matrix.arch }}.app.tar.gz.sig"
          fi
          cd ../../../desktop-dist
          for file in *.dmg *.app.tar.gz; do
            [ -f "$file" ] && shasum -a 256 "$file" > "$file.sha256"
          done
          ls -la
      - name: Remove temporary signing keychain and keys
        if: always()
        env:
          KEYCHAIN: ${{ steps.identity.outputs.keychain }}
        run: |
          [ -n "$KEYCHAIN" ] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/developer-id.p12
      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "rigspark $GITHUB_REF_NAME" --notes "Release notes are added when all archives are verified." \
              || gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber desktop-dist/*

  desktop-windows:
    name: Desktop app (x86_64-pc-windows-msvc)
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 75
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch exact revision without an action runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset AUTH GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install pinned Tauri CLI
        run: |
          rustup show active-toolchain
          cargo install tauri-cli --version 2.12.4 --locked
      - name: Build bundled llama-server from pinned llama.cpp
        run: scripts/build-bundled-llama-server.sh x86_64-pc-windows-msvc
      - name: Build RigSpark installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CI: "true"
        run: |
          set -euo pipefail
          cd apps/desktop/src-tauri
          extra=()
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY is not set; building without in-app update artifacts."
            extra=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          cargo tauri build --target x86_64-pc-windows-msvc --bundles nsis --config tauri.bundled.conf.json ${extra[@]+"${extra[@]}"}
          out="target/x86_64-pc-windows-msvc/release/bundle/nsis"
          setup=$(ls "$out"/*-setup.exe)
          mkdir -p ../../../desktop-dist
          cp "$setup" ../../../desktop-dist/RigSpark_x64-setup.exe
          if [ -f "$setup.sig" ]; then
            cp "$setup.sig" ../../../desktop-dist/RigSpark_x64-setup.exe.sig
          fi
          cd ../../../desktop-dist
          sha256sum RigSpark_x64-setup.exe > RigSpark_x64-setup.exe.sha256
          ls -la
      - name: Install silently and check the bundled runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Start-Process -FilePath desktop-dist\RigSpark_x64-setup.exe -ArgumentList "/S" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "installer exited with $($setup.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA "RigSpark"
          Get-ChildItem $dir
          if (-not (Test-Path (Join-Path $dir "rigspark-desktop.exe"))) { throw "rigspark-desktop.exe was not installed" }
          $server = Join-Path $dir "llama-server.exe"
          if (-not (Test-Path $server)) { throw "llama-server.exe was not installed" }
          $version = & $server --version 2>&1 | Out-String
          if ($version -notmatch "version: ") { throw "installed llama-server did not run: $version" }
      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "rigspark $GITHUB_REF_NAME" --notes "Release notes are added when all archives are verified." \
              || gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber desktop-dist/*

  publish:
    name: Checksums, formula and publication
    needs: [build, desktop-macos, desktop-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch exact revision without an action runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset AUTH GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify every archive and write SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release-assets --pattern 'rigspark-*.tar.gz*'
          cd release-assets
          test "$(ls *.tar.gz | wc -l)" -eq 5
          cat *.tar.gz.sha256 | sort -k2 > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish the desktop update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir desktop-assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir desktop-assets --pattern 'RigSpark_*.app.tar.gz.sig' --pattern 'RigSpark_x64-setup.exe.sig' || true
          if [ "$(ls desktop-assets | wc -l)" -ne 3 ]; then
            echo "::notice::Desktop updater signatures are missing; latest.json is not published."
            exit 0
          fi
          python3 - "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > desktop-assets/latest.json <<'PY'
          import datetime, json, pathlib, sys
          tag, repo = sys.argv[1], sys.argv[2]
          base = f"https://github.com/{repo}/releases/download/{tag}"
          platforms = {}
          for arch in ("aarch64", "x86_64"):
              signature = pathlib.Path(f"desktop-assets/RigSpark_{arch}.app.tar.gz.sig").read_text().strip()
              platforms[f"darwin-{arch}"] = {"signature": signature, "url": f"{base}/RigSpark_{arch}.app.tar.gz"}
          windows = pathlib.Path("desktop-assets/RigSpark_x64-setup.exe.sig").read_text().strip()
          platforms["windows-x86_64"] = {"signature": windows, "url": f"{base}/RigSpark_x64-setup.exe"}
          print(json.dumps({
              "version": tag.removeprefix("v"),
              "notes": f"See https://github.com/{repo}/releases/tag/{tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }, indent=2))
          PY
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber desktop-assets/latest.json
      - name: Generate Homebrew formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo native-dist formula --version "$version" --checksums release-assets/SHA256SUMS > release-assets/rigspark.rb
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version " 'index($0, heading) == 1 {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          {
            printf '\n## Install\n\n```bash\nbrew install shashankswe2020-ux/tap/rigspark\ncargo binstall rigspark-cli rigspark-gui\ncargo install rigspark-cli --locked --bin llmup --bin rigspark && cargo install rigspark-gui --locked\n```\n\n'
            printf 'Desktop: download `RigSpark_aarch64.dmg` (Apple Silicon), `RigSpark_x86_64.dmg` (Intel Mac) or `RigSpark_x64-setup.exe` (Windows). The Mac app is signed with a Developer ID and notarized by Apple, so it opens like any other app.\n\n'
            printf 'Archives are unsigned. Verify downloads against `SHA256SUMS` and each `.sha256` file.\n'
          } >> release-notes.md
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber release-assets/SHA256SUMS release-assets/rigspark.rb
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md --draft=false --latest
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; copy rigspark.rb from the release into shashankswe2020-ux/homebrew-tap."
            exit 0
          fi
          AUTH=$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 | tr -d '\r\n')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"
          git clone --depth 1 https://github.com/shashankswe2020-ux/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp release-assets/rigspark.rb tap/Formula/rigspark.rb
          cd tap
          git add Formula/rigspark.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "rigspark ${GITHUB_REF_NAME#v}"
          git push origin HEAD

  container:
    name: Dispatch container image
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Publish the multi-platform image from the verified archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run container.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$GITHUB_REF_NAME"
