name: Catalog Freshness

on:
  schedule:
    # Every Monday 03:17 UTC.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      candidate_limit:
        description: "Candidate budget (1-10)"
        type: choice
        options: ["1", "2", "5", "10"]
        default: "1"
      use_ai:
        description: "Enable paid OpenAI extraction"
        type: boolean
        default: false
      after:
        description: "Optional repository cursor override"
        type: string
      restart:
        description: "Start from the beginning instead of the merged report cursor"
        type: boolean
        default: false

# Write the refreshed catalog to a dedicated branch and merge it through a
# reviewed PR — never a direct push to the protected default branch.
permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: catalog-enrichment
  cancel-in-progress: false

jobs:
  pending-review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      admit: ${{ steps.check.outputs.admit }}
    steps:
      - name: Preserve pending catalog review
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PENDING=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --limit 100 --json headRefName,url --jq '.[] | select(.headRefName | startswith("catalog/auto-refresh-")) | .url')
          if [ -n "$PENDING" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            printf 'Catalog collection paused: review or close the existing PR before another run.\n%s\n' "$PENDING" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi
          # Admission merges its own PRs; only a stuck one of those pauses it.
          STUCK=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --limit 100 --json headRefName,url --jq '.[] | select(.headRefName | startswith("catalog/auto-admit-")) | .url')
          if [ -n "$STUCK" ]; then
            echo "admit=false" >> "$GITHUB_OUTPUT"
            printf 'Admission paused: an earlier admission PR is still open.\n%s\n' "$STUCK" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "admit=true" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    name: Weekly catalog refresh
    needs: pending-review
    if: github.ref == 'refs/heads/main' && needs.pending-review.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Fetch main history without an action runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"
          git fetch --no-tags origin "$GITHUB_SHA"
          unset AUTH GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Refresh catalog from the registry snapshot
        run: |
          rustup show active-toolchain
          cargo catalog-refresh

      - name: Enrich catalog quant sizes + digests from the live registry
        run: cargo catalog-enrich

      - name: Verify and build source-backed proposal collector
        run: |
          set -euo pipefail
          cargo test --locked -p rigspark-runtime --test catalog_proposals
          cargo test --locked -p rigspark-cli --test catalog_propose_cli
          cargo build --locked -p rigspark-cli --bin llmup-catalog-propose

      - name: Collect candidates with optional OpenAI extraction
        id: proposals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_CATALOG_MODEL: ${{ vars.OPENAI_CATALOG_MODEL }}
          CANDIDATE_LIMIT: ${{ inputs.candidate_limit || '10' }}
          USE_AI: ${{ github.event_name == 'schedule' || inputs.use_ai }}
          AFTER: ${{ inputs.after }}
          RESTART: ${{ inputs.restart }}
        run: |
          set -euo pipefail
          ARGS=(--limit "$CANDIDATE_LIMIT" --out docs/references/catalog-proposals.json)
          if [ "$USE_AI" != "true" ]; then
            ARGS+=(--source-only)
          fi
          if [ -n "$AFTER" ]; then
            ARGS+=(--after "$AFTER")
          elif [ "$RESTART" != "true" ] && [ -f docs/references/catalog-proposals.json ]; then
            cp docs/references/catalog-proposals.json "$RUNNER_TEMP/catalog-proposals-previous.json"
            ARGS+=(--resume-from "$RUNNER_TEMP/catalog-proposals-previous.json")
          fi
          code=0
          target/debug/llmup-catalog-propose "${ARGS[@]}" || code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Summarize candidate diagnostics
        run: |
          set -euo pipefail
          jq -r '["## Catalog proposals", "", "Review required; inventory is not complete.", "", ("Candidates: " + (.proposals | length | tostring)), ("Remaining after this batch: " + (.remainingCandidates | tostring)), ("Next cursor: " + ((.nextAfter // "(restart next cycle)") | tojson)), "", (.proposals[] | "- " + (.repository | tojson) + ": " + .status + "; " + .extractionStatus + "; source claims=" + (.sourceClaims | length | tostring) + "; diagnostic=" + ((.extractionError // "none") | tojson))] | .[]' docs/references/catalog-proposals.json > "$RUNNER_TEMP/catalog-review-summary.md"
          cat "$RUNNER_TEMP/catalog-review-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Report release quality without promoting evidence
        run: |
          set -euo pipefail
          if cargo catalog-quality > docs/references/catalog-quality-latest-report.json; then
            echo "Catalog quality gates passed; publication still requires review and signing approval."
          else
            code=$?
            test "$code" -eq 1
            test -s docs/references/catalog-quality-latest-report.json
            echo "Catalog quality gates blocked publication; opening a remediation PR only."
          fi
          jq -e '.passed | type == "boolean"' docs/references/catalog-quality-latest-report.json > /dev/null

      - name: Summarize publication blockers and evidence work
        run: |
          set -euo pipefail
          jq -r '["", "## Publication quality", "", ("Passed: " + (.passed | tostring)), ("Freshness: " + (if .freshnessPercent == null then "unknown" else (.freshnessPercent | tostring) + "%" end)), ("Correctness: " + (.correctnessPercent | tostring) + "%"), ("Fresh entries: " + (.freshEntries | tostring) + "/" + (.catalogEntries | tostring)), ("Verified entries: " + (.verifiedEntries | tostring) + "/" + (.catalogEntries | tostring)), "", (.blockers[] | "- Blocker: " + tojson), "", "### Entries needing evidence or correction", (.entries[] | select(.verified == false) | "- " + (.id | tojson) + ": " + (.reason | tojson)), "", "### Missing variants", (.missingVariants[] | "- " + tojson), "", "Review and update catalog-quality-evidence.json separately using authoritative sources. These reports do not certify facts. Publication still requires both 90% gates and protected signing approval."] | .[]' docs/references/catalog-quality-latest-report.json >> "$RUNNER_TEMP/catalog-review-summary.md"
          cat "$RUNNER_TEMP/catalog-review-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Audit upstream catalog coverage
        run: cargo catalog-coverage

      - name: Catalog freshness report
        run: |
          rustup show active-toolchain
          cargo catalog-freshness

      - name: Detect catalog changes
        id: diff
        run: |
          # Catalog data and the quality report are owned by the admit job; this job
          # publishes only the advisory proposal report, so the two never conflict.
          if git diff --quiet -- docs/references/catalog-proposals.json &&
             [ -z "$(git ls-files --others --exclude-standard -- docs/references/catalog-proposals.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate the refreshed catalog
        if: steps.diff.outputs.changed == 'true'
        run: |
          cargo test --locked -p rigspark-core --test catalog
          cargo build --workspace --locked

      - name: Open the catalog refresh PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A fresh branch per run (from current main) → a normal push, so the
          # branch-protection ruleset that blocks force-pushes is never tripped.
          BRANCH="catalog/auto-refresh-${GITHUB_RUN_ID}"
          TITLE="chore(catalog): weekly automated refresh"
          BODY=$(cargo catalog-notice refresh-pr --input catalog-freshness.json)
          BODY+=$'\n\nSource-backed discovery proposals: docs/references/catalog-proposals.json. All proposals are unverified and require review; OpenAI never updates quality evidence. Publication eligibility: docs/references/catalog-quality-latest-report.json. Repository discovery is not complete variant coverage.'
          BODY+=$'\n\n'
          BODY+=$(cat "$RUNNER_TEMP/catalog-review-summary.md")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs/references/catalog-proposals.json
          git commit -m "$TITLE"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic $AUTH" push origin "$BRANCH"
          unset AUTH

          gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"

      - name: Alert when the catalog is stale but in sync
        if: steps.diff.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEEDS=$(cargo catalog-notice needs-attention --input catalog-freshness.json)
          if [ "$NEEDS" != "true" ]; then
            echo "Catalog is fresh and in sync — nothing to do."
            exit 0
          fi

          TITLE="Catalog freshness: refresh needed"
          BODY=$(cargo catalog-notice freshness-issue --input catalog-freshness.json)

          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body "$BODY"
          else
            echo "Creating a new freshness issue"
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Reconcile upstream coverage issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Catalog coverage: upstream models missing"
          MISSING=$(cargo catalog-notice missing-count --input catalog-coverage.json)
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')

          if [ "$MISSING" = "0" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "All models in the monitored Ollama local-library inventory are now represented in the curated catalog."
            fi
            echo "Catalog covers the monitored Ollama inventory."
            exit 0
          fi

          BODY=$(cargo catalog-notice coverage-issue --input catalog-coverage.json)

          if [ -n "$EXISTING" ]; then
            echo "Updating existing coverage issue #$EXISTING"
            gh issue edit "$EXISTING" --body "$BODY"
          else
            echo "Creating a catalog coverage issue"
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Fail visibly after preserving partial collection results
        if: steps.proposals.outputs.exit_code == '2'
        run: |
          echo "Collection or extraction failed for some candidates. Review the persisted report and diagnostics before retrying; publication remains independently gated."
          exit 2

  admit:
    name: Admit latest local models
    needs: pending-review
    if: github.ref == 'refs/heads/main' && needs.pending-review.outputs.admit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch main history without an action runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"
          git fetch --no-tags origin "$GITHUB_SHA"
          unset AUTH GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify admission before trusting it
        run: |
          set -euo pipefail
          cargo test --locked -p rigspark-core --test admission --test generation_admission
          cargo test --locked -p rigspark-runtime --test catalog_admission --test generation_admission --test catalog_quality
          cargo build --locked -p rigspark-cli --bin llmup-catalog-admit --bin llmup-generation-admit

      - name: Admit sourced text models and correct contradicted curated facts
        run: |
          set -euo pipefail
          cargo catalog-enrich
          cargo catalog-admit --correct-curated --max-new 400 > "$RUNNER_TEMP/admit.json"

      - name: Admit sourced image and video releases
        run: |
          set -euo pipefail
          cargo generation-admit > "$RUNNER_TEMP/generation-admit.json"

      - name: Regenerate last-month site data
        run: cargo catalog-site

      - name: Gate on the full suite and publication quality
        id: gate
        run: |
          set -euo pipefail
          cargo test --workspace --locked -- --test-threads=2
          if cargo catalog-quality > docs/references/catalog-quality-latest-report.json; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          jq -r '"Admitted: \(.added | length); corrected: \(.corrections | length); rejected: \(.rejected | length); complete: \(.complete)"' "$RUNNER_TEMP/admit.json" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"Image/video admitted: \(.added | length); removed: \(.removed | length)"' "$RUNNER_TEMP/generation-admit.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Open, verify and merge the data-only admission PR
        id: merge
        env:
          MERGE_TOKEN: ${{ secrets.CATALOG_MERGE_TOKEN }}
          FALLBACK_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ALLOWED='^(crates/rigspark-core/data/models\.json|crates/rigspark-core/data/generation\.json|docs/references/catalog-quality-evidence\.json|docs/references/catalog-quality-latest-report\.json|docs/references/catalog-admission-state\.json|docs/references/generation-admission-state\.json|docs/references/catalog-corrections\.json|site/data/latest\.js)$'
          CHANGED=$(git status --porcelain --untracked-files=all | cut -c4-)
          if [ -z "$CHANGED" ]; then
            echo "Nothing new upstream." >> "$GITHUB_STEP_SUMMARY"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$CHANGED" | grep -Ev "$ALLOWED"; then
            echo "Admission touched files outside the data allow-list; refusing." >&2
            exit 1
          fi
          # A maintainer token makes the PR start the required CI; GITHUB_TOKEN pushes cannot.
          export GH_TOKEN="${MERGE_TOKEN:-$FALLBACK_TOKEN}"
          BRANCH="catalog/auto-admit-${GITHUB_RUN_ID}"
          TITLE="chore(catalog): admit latest local models"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          printf '%s\n' "$CHANGED" | xargs git add --
          git commit -q -m "$TITLE"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic $AUTH" push origin "$BRANCH"
          unset AUTH
          BODY=$(printf 'Automated, source-backed admission. Every auto entry is digest-pinned and cited; curated corrections are recorded in docs/references/catalog-corrections.json.\n\n%s' "$(cat "$GITHUB_STEP_SUMMARY")")
          URL=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY")
          if [ -z "${MERGE_TOKEN:-}" ]; then
            echo "CATALOG_MERGE_TOKEN is not configured; left $URL for review." >> "$GITHUB_STEP_SUMMARY"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sleep 60
          gh pr checks "$URL" --watch --interval 60 --fail-fast --required
          if gh pr diff "$URL" --name-only | grep -Ev "$ALLOWED"; then
            echo "PR diff left the data allow-list; refusing to merge." >&2
            exit 1
          fi
          gh pr merge "$URL" --admin --squash --delete-branch
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Publish the signed catalog when the quality gate passes
        if: steps.merge.outputs.merged == 'true' && steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.CATALOG_MERGE_TOKEN }}
        run: gh workflow run catalog-publish.yml --ref main

